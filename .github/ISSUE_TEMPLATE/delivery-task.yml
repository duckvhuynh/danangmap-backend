name: Delivery task
description: Plan an implementation, documentation, QA, security, or operations task.
title: '[M?] '
body:
  - type: textarea
    id: requirement
    attributes:
      label: Requirement
      description: List the exact PRD/SRS/API/PLANS requirement or backlog IDs.
      placeholder: 'FR-... / NFR-... / C-... / B-... / Q-...'
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Describe the bounded outcome and explicitly excluded work.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Add observable, testable criteria as a checklist.
      placeholder: '- [ ] ...'
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Link blocking issues/PRs across both repositories, or write None.
      placeholder: 'Depends on #... / duckvhuynh/danangmap-frontend#...'
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Test and evidence plan
      description: Name the commands, fixtures, CI jobs, screenshots, or deployment evidence required for closure.
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk
      description: Select the highest current delivery or security risk.
      options:
        - None
        - Low
        - Medium
        - High
        - Accepted
    validations:
      required: true
  - type: textarea
    id: risk_detail
    attributes:
      label: Risk detail and mitigation
      description: Explain the trigger, mitigation, owner, and review point; write None when Risk is None.
    validations:
      required: true
