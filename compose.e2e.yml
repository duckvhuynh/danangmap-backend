name: danangmap

services:
  postgres:
    extends:
      file: compose.yml
      service: postgres

  redis:
    extends:
      file: compose.yml
      service: redis

  minio:
    extends:
      file: compose.yml
      service: minio

  migrate:
    extends:
      file: compose.yml
      service: migrate

  seed:
    extends:
      file: compose.yml
      service: seed
    environment:
      SEED_CROSSSTACK_FIXTURES: 'true'
      SEED_DURABLE_PUBLICATION_FIXTURE: 'true'
      DANANGMAP_RUN_NONCE: ${DANANGMAP_RUN_NONCE:-integration-durable-publication}

  api:
    extends:
      file: compose.yml
      service: api
    environment:
      # Canonical Docker tests upload from another service on this network. Host-run
      # browser tests can override this with DANANGMAP_E2E_MINIO_PUBLIC_ENDPOINT=localhost.
      MINIO_PUBLIC_ENDPOINT: ${DANANGMAP_E2E_MINIO_PUBLIC_ENDPOINT:-minio}
      MINIO_PUBLIC_PORT: 9000
      MINIO_PUBLIC_USE_SSL: 'false'
      MINIO_PUBLIC_PATH_STYLE: 'true'
      MINIO_REGION: us-east-1

  mailpit:
    image: axllent/mailpit:v1.30.7
    ports:
      - '1025:1025'
      - '8025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  worker:
    extends:
      file: compose.yml
      service: worker
    environment:
      SMTP_ENABLED: 'true'
      MAIL_DELIVERY_REQUIRED: 'false'
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_TLS_MODE: none
      SMTP_REJECT_UNAUTHORIZED: 'false'
      SMTP_FROM_NAME: Bản đồ số Đà Nẵng
      SMTP_FROM_ADDRESS: no-reply@danangmap.test
      MAIL_SWEEP_INTERVAL_MS: 1000
      SMTP_PROBE_INTERVAL_MS: 1000
      MAIL_CLAIM_LEASE_SECONDS: 15
      MAIL_MAX_ATTEMPTS: 3
      MAIL_BACKOFF_BASE_SECONDS: 1
      MAIL_BACKOFF_MAX_SECONDS: 10
      MAIL_BACKOFF_JITTER_PERCENT: 0
      SMTP_PER_RECIPIENT_INTERVAL_SECONDS: 1
      MAIL_FAILED_PAYLOAD_RETENTION_HOURS: 1
      MAIL_WORKER_HEARTBEAT_STALE_SECONDS: 30
    depends_on:
      mailpit:
        condition: service_healthy

  test:
    build:
      context: .
      target: test
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://danangmap:danangmap@postgres:5432/danangmap
      DATABASE_SSL: 'false'
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ASYNC_PUBLICATION_ENABLED: ${ASYNC_PUBLICATION_ENABLED:-false}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_PUBLIC_ENDPOINT: minio
      MINIO_PUBLIC_PORT: 9000
      MINIO_PUBLIC_USE_SSL: 'false'
      MINIO_PUBLIC_PATH_STYLE: 'true'
      MINIO_REGION: us-east-1
      MINIO_ACCESS_KEY: danangmap
      MINIO_SECRET_KEY: danangmap-local-secret
      MINIO_BUCKET: danangmap
      ATTACHMENT_UPLOAD_TTL_SECONDS: 600
      ATTACHMENT_ORPHAN_RETENTION_HOURS: 1
      ATTACHMENT_SWEEP_INTERVAL_MS: 10000
      ATTACHMENT_SCANNER_MODE: deterministic
      ATTACHMENT_SCAN_TIMEOUT_MS: 30000
      SESSION_PEPPER: local-only-session-pepper-change-in-production
      FIELD_ENCRYPTION_KEY: local-only-field-encryption-key-change-in-production
      FRONTEND_ORIGINS: http://localhost:3000
      COOKIE_SECURE: 'false'
      MFA_TOTP_ISSUER: DanangMap
      SEED_ADMIN_PASSWORD: ChangeMe-Admin-2026!
      SEED_EDITOR_PASSWORD: ChangeMe-Editor-2026!
      SEED_REVIEWER_PASSWORD: ChangeMe-Reviewer-2026!
      SEED_PUBLISHER_PASSWORD: ChangeMe-Publisher-2026!
      SEED_MFA_SECRET: JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP
      ALLOW_SEED: 'true'
      SEED_CROSSSTACK_FIXTURES: 'true'
      DANANGMAP_E2E_AUTH_RESET: 'true'
      GEO_SERVICE_BASE_URL: ''
      DANANGMAP_RUN_NONCE: ${DANANGMAP_RUN_NONCE:-integration-durable-publication}
      API_BASE_URL: http://api:4000
      MAILPIT_API_URL: http://mailpit:8025
    command: ['npm', 'run', 'test:integration']
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started
      mailpit:
        condition: service_healthy
    restart: 'no'

  frontend:
    profiles: ['fullstack']
    build:
      context: ${DANANGMAP_FRONTEND_CONTEXT:-../danangmap-frontend}
      args:
        NEXT_PUBLIC_API_BASE_URL: ${DANANGMAP_BROWSER_API_BASE_URL:-http://localhost:4000}
        NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN:-}
        NEXT_PUBLIC_DANANGMAP_DEMO_MODE: 'false'
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${DANANGMAP_FRONTEND_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  fullstack-smoke:
    profiles: ['fullstack']
    build:
      context: .
      target: test
    environment:
      API_BASE_URL: http://api:4000
      FRONTEND_BASE_URL: http://frontend:3000
      FRONTEND_PUBLIC_ORIGIN: http://localhost:3000
    command: ['node', 'scripts/verify-fullstack-harness.mjs']
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started
      frontend:
        condition: service_healthy
    restart: 'no'

volumes:
  postgres-data:
  redis-data:
  minio-data:
