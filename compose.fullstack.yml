name: danangmap-fullstack

services:
  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  minio:
    ports: !reset []

  mailpit:
    ports: !reset []
    command:
      [
        '--smtp-tls-cert',
        '/certs/cert.pem',
        '--smtp-tls-key',
        '/certs/key.pem',
        '--smtp-require-starttls',
      ]
    volumes:
      - mailpit-tls:/certs:ro
    depends_on:
      mailpit-tls:
        condition: service_completed_successfully

  mailpit-tls:
    image: alpine/openssl@sha256:47f40fac08a77cbdfb02444e543808aa36b9e31e21a261f4d94ffaf0c5c73832
    profiles: ['fullstack']
    command:
      [
        'req',
        '-x509',
        '-newkey',
        'rsa:2048',
        '-nodes',
        '-keyout',
        '/certs/key.pem',
        '-out',
        '/certs/cert.pem',
        '-days',
        '1',
        '-subj',
        '/CN=mailpit',
        '-addext',
        'subjectAltName=DNS:mailpit',
      ]
    volumes:
      - mailpit-tls:/certs
    restart: 'no'

  migrate:
    build:
      labels:
        danangmap.backend.revision: ${DANANGMAP_BACKEND_SHA:?DANANGMAP_BACKEND_SHA is required}
    labels:
      danangmap.backend.revision: ${DANANGMAP_BACKEND_SHA:?DANANGMAP_BACKEND_SHA is required}

  seed:
    build:
      labels:
        danangmap.backend.revision: ${DANANGMAP_BACKEND_SHA:?DANANGMAP_BACKEND_SHA is required}
    labels:
      danangmap.backend.revision: ${DANANGMAP_BACKEND_SHA:?DANANGMAP_BACKEND_SHA is required}
    environment:
      SEED_ROLLBACK_PUBLISHER_PASSWORD: ${SEED_ROLLBACK_PUBLISHER_PASSWORD:-ChangeMe-rollback-publisher-2026!}
      DANANGMAP_RUN_NONCE: ${DANANGMAP_RUN_NONCE:?DANANGMAP_RUN_NONCE is required}

  api:
    ports: !reset []
    build:
      labels:
        danangmap.backend.revision: ${DANANGMAP_BACKEND_SHA:?DANANGMAP_BACKEND_SHA is required}
    labels:
      danangmap.backend.revision: ${DANANGMAP_BACKEND_SHA:?DANANGMAP_BACKEND_SHA is required}
    environment:
      NODE_ENV: ${DANANGMAP_ASYNC_API_NODE_ENV:-development}
      ASYNC_PUBLICATION_ENABLED: 'true'
      PUBLICATION_DISPATCH_INTERVAL_MS: 500
      PUBLICATION_RECOVERY_INTERVAL_MS: 1000
      PUBLICATION_WORKER_STALE_SECONDS: 30
      COOKIE_SECURE: 'true'
      FRONTEND_ORIGINS: https://gateway

  worker:
    build:
      labels:
        danangmap.backend.revision: ${DANANGMAP_BACKEND_SHA:?DANANGMAP_BACKEND_SHA is required}
    labels:
      danangmap.backend.revision: ${DANANGMAP_BACKEND_SHA:?DANANGMAP_BACKEND_SHA is required}
    environment:
      NODE_ENV: ${DANANGMAP_CANONICAL_WORKER_NODE_ENV:-development}
      ASYNC_PUBLICATION_ENABLED: 'true'
      PUBLICATION_BUILD_BATCH_SIZE: 1
      PUBLICATION_BUILD_LEASE_SECONDS: 15
      PUBLICATION_HEARTBEAT_INTERVAL_MS: 1000
      PUBLICATION_RECOVERY_INTERVAL_MS: 1000
      PUBLICATION_WORKER_STALE_SECONDS: 30
      SMTP_TLS_MODE: starttls
      SMTP_REJECT_UNAUTHORIZED: 'true'
      NODE_EXTRA_CA_CERTS: /certs/cert.pem
    volumes:
      - mailpit-tls:/certs:ro
    restart: 'no'

  crash-worker:
    extends:
      file: compose.yml
      service: worker
    build:
      labels:
        danangmap.backend.revision: ${DANANGMAP_BACKEND_SHA:?DANANGMAP_BACKEND_SHA is required}
    labels:
      danangmap.backend.revision: ${DANANGMAP_BACKEND_SHA:?DANANGMAP_BACKEND_SHA is required}
      danangmap.test.role: durable-publication-crash-worker
    environment:
      NODE_ENV: test
      ASYNC_PUBLICATION_ENABLED: 'true'
      PUBLICATION_BUILD_BATCH_SIZE: 1
      PUBLICATION_BUILD_LEASE_SECONDS: 15
      PUBLICATION_HEARTBEAT_INTERVAL_MS: 1000
      PUBLICATION_RECOVERY_INTERVAL_MS: 1000
      PUBLICATION_WORKER_STALE_SECONDS: 30
      PUBLICATION_TEST_BARRIER: after_batch_commit
    restart: 'no'

  frontend:
    ports: !reset []
    labels:
      danangmap.frontend.revision: ${DANANGMAP_FRONTEND_SHA:?DANANGMAP_FRONTEND_SHA is required}
    build:
      labels:
        danangmap.frontend.revision: ${DANANGMAP_FRONTEND_SHA:?DANANGMAP_FRONTEND_SHA is required}
      args:
        NEXT_PUBLIC_API_BASE_URL: https://gateway

  gateway:
    image: caddy:2.10.2-alpine
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    volumes:
      - ./docker/Caddyfile.e2e:/etc/caddy/Caddyfile:ro
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-check-certificate',
          '--quiet',
          '--spider',
          'https://gateway/api/health',
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  fullstack-smoke:
    build:
      labels:
        danangmap.backend.revision: ${DANANGMAP_BACKEND_SHA:?DANANGMAP_BACKEND_SHA is required}
    labels:
      danangmap.backend.revision: ${DANANGMAP_BACKEND_SHA:?DANANGMAP_BACKEND_SHA is required}
    environment:
      FRONTEND_PUBLIC_ORIGIN: https://gateway
      CROSSSTACK_PUBLICATION_LAYER_SLUG: cross-stack-publication
      DURABLE_PUBLICATION_LAYER_SLUG: durable-publication-activation
      EXPECT_PUBLICATION_READINESS: degraded
    depends_on:
      gateway:
        condition: service_healthy

  fullstack-browser:
    profiles: ['fullstack']
    labels:
      danangmap.frontend.revision: ${DANANGMAP_FRONTEND_SHA:?DANANGMAP_FRONTEND_SHA is required}
    build:
      context: ${DANANGMAP_FRONTEND_CONTEXT:-../danangmap-frontend}
      dockerfile: Dockerfile.e2e
      labels:
        danangmap.frontend.revision: ${DANANGMAP_FRONTEND_SHA:?DANANGMAP_FRONTEND_SHA is required}
    environment:
      CI: 'true'
      DANANGMAP_REAL_STACK: 'true'
      DANANGMAP_CMS1_ENABLED: 'true'
      DANANGMAP_HISTORY_ENABLED: 'true'
      DANANGMAP_ASYNC_PUBLICATION_ENABLED: 'true'
      DANANGMAP_ACTIVATION_LAYER_SLUG: durable-publication-activation
      DANANGMAP_EXPECTED_PUBLICATION_FEATURE_TOTAL: '3'
      DANANGMAP_DURABLE_PUBLICATION_PHASE_DIR: /phase
      DANANGMAP_DURABLE_PUBLICATION_RUN_NONCE: ${DANANGMAP_RUN_NONCE:?DANANGMAP_RUN_NONCE is required}
      PLAYWRIGHT_BASE_URL: https://gateway
      MAILPIT_BASE_URL: http://mailpit:8025
      DANANGMAP_ADMIN_LOGIN: ${DANANGMAP_ADMIN_LOGIN:-admin}
      DANANGMAP_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe-Admin-2026!}
      DANANGMAP_ADMIN_TOTP_SECRET: ${SEED_MFA_SECRET:-JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP}
      DANANGMAP_GATE_B_ENABLED: 'true'
      DANANGMAP_GATE_B_EDITOR_LOGIN: editor
      DANANGMAP_GATE_B_EDITOR_PASSWORD: ${SEED_EDITOR_PASSWORD:-ChangeMe-Editor-2026!}
      DANANGMAP_GATE_B_REVIEWER_LOGIN: reviewer
      DANANGMAP_GATE_B_REVIEWER_PASSWORD: ${SEED_REVIEWER_PASSWORD:-ChangeMe-Reviewer-2026!}
      DANANGMAP_GATE_B_PUBLISHER_LOGIN: publisher
      DANANGMAP_GATE_B_PUBLISHER_PASSWORD: ${SEED_PUBLISHER_PASSWORD:-ChangeMe-Publisher-2026!}
      DANANGMAP_GATE_B_TOTP_SECRET: ${SEED_MFA_SECRET:-JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP}
      DANANGMAP_HISTORY_ROLLBACK_PUBLISHER_LOGIN: rollback-publisher
      DANANGMAP_HISTORY_ROLLBACK_PUBLISHER_PASSWORD: ${SEED_ROLLBACK_PUBLISHER_PASSWORD:-ChangeMe-rollback-publisher-2026!}
      DANANGMAP_HISTORY_SYSTEM_ADMIN_LOGIN: admin
      DANANGMAP_HISTORY_SYSTEM_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe-Admin-2026!}
      DANANGMAP_HISTORY_TOTP_SECRET: ${SEED_MFA_SECRET:-JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP}
      DANANGMAP_GATE_B_LAYER_SLUG: cross-stack-publication
      DANANGMAP_GATE_B_BASE_GENERATION: '1'
      DANANGMAP_GATE_B_BASE_FEATURE_NAME: Điểm nền Gate B
      DANANGMAP_GATE_B_IMPORTED_FEATURE_NAME: Điểm nhập Gate B
      DANANGMAP_GATE_B_PRIVATE_FIELD_KEY: internal_note
      DANANGMAP_GATE_B_PRIVATE_VALUE: Gate B private value
    command:
      ['npx', 'playwright', 'test', '--config=playwright.real.config.ts', '--project=real-stack']
    volumes:
      - type: bind
        source: ${DANANGMAP_PLAYWRIGHT_REPORT_DIR:-./artifacts/fullstack/playwright-report}
        target: /app/playwright-report
      - type: bind
        source: ${DANANGMAP_PLAYWRIGHT_RESULTS_DIR:-./artifacts/fullstack/test-results}
        target: /app/test-results
      - type: bind
        source: ${DANANGMAP_PHASE_DIR:?DANANGMAP_PHASE_DIR is required}
        target: /phase
    depends_on:
      fullstack-smoke:
        condition: service_completed_successfully
      gateway:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    restart: 'no'

  test:
    build:
      labels:
        danangmap.backend.revision: ${DANANGMAP_BACKEND_SHA:?DANANGMAP_BACKEND_SHA is required}
    labels:
      danangmap.backend.revision: ${DANANGMAP_BACKEND_SHA:?DANANGMAP_BACKEND_SHA is required}

  publication-barrier:
    profiles: ['fullstack']
    build:
      context: .
      target: test
      labels:
        danangmap.backend.revision: ${DANANGMAP_BACKEND_SHA:?DANANGMAP_BACKEND_SHA is required}
    labels:
      danangmap.backend.revision: ${DANANGMAP_BACKEND_SHA:?DANANGMAP_BACKEND_SHA is required}
      danangmap.test.role: durable-publication-advisory-barrier
    environment:
      DATABASE_URL: postgresql://danangmap:danangmap@postgres:5432/danangmap
      DANANGMAP_PHASE_DIRECTORY: /phase
      DANANGMAP_RUN_NONCE: ${DANANGMAP_RUN_NONCE:?DANANGMAP_RUN_NONCE is required}
    command: ['node', 'scripts/hold-publication-barrier.mjs']
    volumes:
      - type: bind
        source: ${DANANGMAP_PHASE_DIR:?DANANGMAP_PHASE_DIR is required}
        target: /phase
    restart: 'no'

volumes:
  mailpit-tls:
