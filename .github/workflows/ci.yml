name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run audit:prod
      - name: Start clean spatial stack
        run: docker compose -f compose.e2e.yml up -d --build postgres redis minio migrate seed mailpit api worker
      - name: Verify health
        run: |
          curl --fail --retry 30 --retry-delay 2 --retry-all-errors --retry-max-time 90 http://localhost:4000/health/live
          curl --fail --retry 30 --retry-delay 2 --retry-all-errors --retry-max-time 90 http://localhost:4000/health/ready
      - name: Verify SMTP degradation does not fail core readiness
        run: |
          docker compose -f compose.e2e.yml stop mailpit
          node scripts/assert-mail-readiness.mjs degraded 30000
          docker compose -f compose.e2e.yml start mailpit
          node scripts/assert-mail-readiness.mjs up 30000
      - name: Verify password-reset receipt survives API restart
        run: |
          node scripts/verify-password-reset-restart.mjs before
          docker compose -f compose.e2e.yml restart api
          curl --fail --retry 30 --retry-delay 2 --retry-all-errors --retry-max-time 90 http://localhost:4000/health/ready
          node scripts/verify-password-reset-restart.mjs after
      - run: docker compose -f compose.e2e.yml run --rm --build test
      - run: docker compose -f compose.e2e.yml run --rm test npm run test:e2e
      - name: Verify isolated flag-on durable publication worker checkpoint
        env:
          ASYNC_PUBLICATION_ENABLED: 'true'
        run: |
          docker compose -f compose.e2e.yml up -d --no-deps --force-recreate api worker
          curl --fail --retry 30 --retry-delay 2 --retry-all-errors --retry-max-time 90 http://localhost:4000/health/ready
          docker compose -f compose.e2e.yml run --rm --no-deps \
            -e ASYNC_PUBLICATION_WORKER_EXPECTED=true \
            test npm run test:e2e:async-publication
      - run: npm run openapi:check
      - if: always()
        run: docker compose -f compose.e2e.yml down -v --remove-orphans

  cross-stack-browser:
    if: >-
      github.event_name == 'pull_request' &&
      (github.head_ref == 'integration/v2-canonical-backend' ||
       github.head_ref == 'integration/v2-identity-recovery' ||
       github.head_ref == 'chore/fullstack-system-admin-lifecycle' ||
       github.head_ref == 'test/durable-publication-activation')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      DANANGMAP_BACKEND_SHA: ${{ github.event.pull_request.head.sha }}
      DANANGMAP_FRONTEND_CONTEXT: ${{ github.workspace }}/.crossstack/danangmap-frontend
      DANANGMAP_FRONTEND_SHA: e4ba1d013c1fb332826801a06fa8cb5de1221a0b
      DANANGMAP_FULLSTACK_RUNS: '2'
      DANANGMAP_ACTIVATION_MODE: production
      DANANGMAP_ASYNC_API_NODE_ENV: production
      DANANGMAP_CANONICAL_WORKER_NODE_ENV: production
    steps:
      - name: Checkout exact backend revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Require private cross-repository read token
        env:
          CROSS_REPO_READ_TOKEN: ${{ secrets.CROSS_REPO_READ_TOKEN }}
        run: |
          if [ -z "$CROSS_REPO_READ_TOKEN" ]; then
            echo "CROSS_REPO_READ_TOKEN is required for the private exact-SHA frontend checkout." >&2
            exit 1
          fi
      - name: Checkout exact frontend revision
        uses: actions/checkout@v4
        with:
          repository: duckvhuynh/danangmap-frontend
          ref: ${{ env.DANANGMAP_FRONTEND_SHA }}
          path: .crossstack/danangmap-frontend
          token: ${{ secrets.CROSS_REPO_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - name: Run two fresh-volume browser journeys without route mocks
        run: npm run test:fullstack:harness
      - name: Preserve cross-stack reports and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-stack-browser-${{ github.event.pull_request.head.sha }}
          path: artifacts/fullstack
          if-no-files-found: error
          retention-days: 7
