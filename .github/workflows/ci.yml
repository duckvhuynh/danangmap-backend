name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run audit:prod
      - name: Start clean spatial stack
        run: docker compose up -d --build
      - name: Verify health
        run: |
          curl --fail --retry 20 --retry-delay 2 --retry-connrefused http://localhost:4000/health/live
          curl --fail http://localhost:4000/health/ready
      - run: docker compose -f compose.e2e.yml run --rm --build test
      - run: docker compose -f compose.e2e.yml run --rm test npm run test:e2e
      - run: npm run openapi:check
      - if: always()
        run: docker compose down -v --remove-orphans
